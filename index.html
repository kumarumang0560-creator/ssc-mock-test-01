<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSC Mock Test</title>
<style>
:root{--bg:#f1f4f9;--cd:#fff;--tx:#1b2430;--mu:#667085;--pr:#1d4ed8;--bd:#d6dce6;--ok:#16a34a;--no:#dc2626;--rv:#7c3aed;--gr:#cbd2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141b;--cd:#1a222d;--tx:#e8edf4;--mu:#9aa6b6;--bd:#2d3846;--gr:#3a4656;--pr:#5b8cff}}
:root[data-theme=dark]{--bg:#0f141b;--cd:#1a222d;--tx:#e8edf4;--mu:#9aa6b6;--bd:#2d3846;--gr:#3a4656;--pr:#5b8cff}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
#app{max-width:900px;margin:0 auto;padding:10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
h2,h3{margin:6px 0}small,.mu{color:var(--mu)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:9px 13px;cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.g{background:var(--ok);color:#fff;border-color:var(--ok)}button.d{color:var(--no);border-color:var(--no)}button.v{background:var(--rv);color:#fff;border-color:var(--rv)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin:4px 0 10px}
textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto;width:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pr);color:#fff;padding:9px 12px;border-radius:10px}
.top button{padding:6px 10px}.tm{font:700 20px ui-monospace,Menlo,monospace}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 2px;font-weight:600}.bar select{width:auto;margin:0;padding:5px}
.mk{color:var(--ok);font-size:14px}.qt{font-size:18px;margin-bottom:12px}
.hi{margin-top:4px;opacity:.95}
.op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.op>span{min-width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-weight:700}
.op.on{border-color:var(--pr);background:rgba(29,78,216,.1)}.op.on>span{background:var(--pr);color:#fff}
.op.ok{border-color:var(--ok);background:rgba(22,163,74,.12)}.op.bad{border-color:var(--no);background:rgba(220,38,38,.1)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.nav button{flex:1 1 130px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.pb{height:40px;border-radius:8px;border:0;color:#fff;font-weight:700;padding:0;background:var(--gr);color:var(--tx)}
.pb.s1{background:var(--no);color:#fff}.pb.s2{background:var(--ok);color:#fff}.pb.s3{background:var(--rv);color:#fff}.pb.s4{background:var(--rv);color:#fff;box-shadow:inset -8px -8px 0 -2px var(--ok)}.pb.cur{outline:3px solid var(--pr)}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:8px 0}.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.88);z-index:20;display:grid;place-items:center;padding:20px;color:#fff;text-align:center}
#dlg:not(:empty){position:fixed;inset:0;background:rgba(10,15,25,.6);z-index:30;display:grid;place-items:center;padding:16px}
#dlg .bx{background:var(--cd);border-radius:12px;padding:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}.st div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.st b{display:block;font-size:22px}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;font-size:.9em}.fr i{font-style:normal;padding:0 3px}.fr i:first-child{border-bottom:1px solid currentColor}
.tg{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.ex{background:var(--bg);border-left:4px solid var(--pr);padding:8px 10px;border-radius:6px;margin-top:8px}
.er{color:var(--no);white-space:pre-wrap}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1;font-weight:700}
</style></head><body>
<div id="app"></div><div id="dlg"></div>
<script>
const $=s=>document.querySelector(s),MAX=500,mem={};
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},r(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}};
let tests=LS.g('tests',[]),srv=[],cat='SSC',DB=null,ED=false,sst='',view='home',T=null,P=null,R=null,lang=LS.g('lang','both'),flt='all',tk=null,last=0,cnt=0;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SY=[[/&lt;=/g,'≤'],[/&gt;=/g,'≥'],[/!=/g,'≠'],[/~=/g,'≈'],[/\+-/g,'±'],[/-&gt;/g,'→'],[/\bpi\b/g,'π'],[/\btheta\b/g,'θ'],[/\balpha\b/g,'α'],[/\bbeta\b/g,'β'],[/\bdeg\b/g,'°'],[/\binf\b/g,'∞'],[/\btimes\b/g,'×'],[/\bdiv\b/g,'÷']];
function fmt(s){s=esc(s||'');s=s.replace(/frac\(([^,()]+),([^()]+)\)/g,'<span class="fr"><i>$1</i><i>$2</i></span>').replace(/\^(\([^)]*\)|-?[\w.]+)/g,(m,a)=>'<sup>'+a.replace(/^\(|\)$/g,'')+'</sup>').replace(/([A-Za-z])_(\w+)/g,'$1<sub>$2</sub>').replace(/sqrt\(/g,'√(').replace(/cbrt\(/g,'∛(');SY.forEach(x=>s=s.replace(x[0],x[1]));return s}
function pk(p,l){l=l||lang;if(!p)return'';const e=p[0]||'',h=p[1]||'';if(l=='en'||(!h&&l!='hi'))return fmt(e);if(l=='hi')return fmt(h||e);return fmt(e)+'<div class="hi">'+fmt(h)+'</div>'}
const ft=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const sp=s=>{const p=String(s||'').split('||').map(x=>x.trim());return[p[0]||'',p[1]||'']};
const sv=()=>LS.s('tests',tests);
function dlg(h){$('#dlg').innerHTML=h?'<div class="bx">'+h+'</div>':''}
function toast(m){dlg('<p>'+m+'</p><button class="p" onclick="dlg(\'\')">OK</button>')}
function cfm(m,fn){window._f=fn;dlg('<p>'+m+'</p><div class="row"><button onclick="dlg(\'\')">Nahi / No</button><button class="d" onclick="dlg(\'\');_f()">Haan / Yes</button></div>')}
function cp(id){const t=$('#'+id);t.select();try{navigator.clipboard.writeText(t.value).then(()=>{},()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(x){}}t.nextElementSibling.textContent='Copied ✓ (ya select karke copy karein)'}
/* ---------- parser ---------- */
function parse(t){const qs=[],bad=[];let c=null,k=null,n=0;
const fin=()=>{if(!c)return;n++;let a='ABCD'.indexOf((c.ans||'').trim().toUpperCase()[0]);const nn=parseInt(c.ans);if(a<0&&nn>=1&&nn<=4)a=nn-1;
if(c.q&&c.o.every(Boolean)&&a>=0)qs.push({q:sp(c.q),o:c.o.map(sp),a:a,e:sp(c.e)});else bad.push(n)};
const re=/^\s*(Q\d*|ANS|EXP|[ABCD])\s*[:：]\s*(.*)$/i;
String(t).split(/\r?\n/).forEach(l=>{const m=l.match(re);
if(m){const f=m[1].toUpperCase();if(f[0]=='Q'){fin();c={q:m[2],o:['','','',''],ans:'',e:''};k=['q']}
else if(c){if(f=='ANS'){k=['ans'];c.ans=m[2]}else if(f=='EXP'){k=['e'];c.e=m[2]}else{const j='ABCD'.indexOf(f);k=['o',j];c.o[j]=m[2]}}}
else if(c&&k&&l.trim()){if(k[0]=='o')c.o[k[1]]+=' '+l.trim();else c[k[0]]+=' '+l.trim()}});
fin();return{qs,bad}}
const EX={
gk:`Q1: What is the capital of India? || भारत की राजधानी क्या है?
A: Mumbai || मुंबई
B: New Delhi || नई दिल्ली
C: Kolkata || कोलकाता
D: Chennai || चेन्नई
ANS: B
EXP: New Delhi is the capital of India. || नई दिल्ली भारत की राजधानी है।

Q2: Who wrote the Constitution drafting committee report as Chairman? || संविधान प्रारूप समिति के अध्यक्ष कौन थे?
A: Dr. B. R. Ambedkar || डॉ. बी. आर. अम्बेडकर
B: J. L. Nehru || जे. एल. नेहरू
C: Sardar Patel || सरदार पटेल
D: Dr. Rajendra Prasad || डॉ. राजेंद्र प्रसाद
ANS: A
EXP: Dr. Ambedkar chaired the Drafting Committee. || डॉ. अम्बेडकर प्रारूप समिति के अध्यक्ष थे।`,
math:`Q1: If x^2 = 49, then the positive value of x is? || यदि x^2 = 49 हो, तो x का धनात्मक मान क्या है?
A: 5 || 5
B: 7 || 7
C: 9 || 9
D: 14 || 14
ANS: B
EXP: sqrt(49) = 7 || sqrt(49) = 7

Q2: frac(3,4) + frac(1,4) = ? || frac(3,4) + frac(1,4) = ?
A: 1 || 1
B: frac(1,2) || frac(1,2)
C: frac(3,8) || frac(3,8)
D: 2 || 2
ANS: A
EXP: (3 + 1)/4 = 1 || (3 + 1)/4 = 1

Q3: The value of sqrt(144) + 2^3 is? || sqrt(144) + 2^3 का मान क्या है?
A: 18 || 18
B: 20 || 20
C: 22 || 22
D: 24 || 24
ANS: B
EXP: 12 + 8 = 20 || 12 + 8 = 20

Q4: The sum of angles of a triangle is? || त्रिभुज के कोणों का योग?
A: 90 deg || 90 deg
B: 180 deg || 180 deg
C: 270 deg || 270 deg
D: 360 deg || 360 deg
ANS: B
EXP: Angle sum property. || कोण योग गुण।`,
rs:`Q1: Find the next number: 2, 4, 8, 16, ? || अगली संख्या ज्ञात करें: 2, 4, 8, 16, ?
A: 24 || 24
B: 30 || 30
C: 32 || 32
D: 36 || 36
ANS: C
EXP: Each term is multiplied by 2. || प्रत्येक पद 2 से गुणा होता है।`};
/* ---------- home ---------- */
function Vh(){const base=location.href.split('#')[0];
return`<div class="top"><b>📝 SSC Mock Test</b><span>${tests.length}/${MAX} tests</span></div>
<div class="tabs"></div>
<div class="c"><div class="row"><button class="p" onclick="nw()">+ Naya Test banayein</button><button onclick="impC()">⬇ Share code se test lein</button><button onclick="shApp()">🔗 App ka link share</button></div>
<small>☁ ${esc(sst||'Server check ho raha hai...')}${ED?' · aap editor hain: test server par daal sakte hain':''}. Local test sirf is device par rehta hai.</small></div>
${vis().length?'':'<div class="c mu">Abhi koi test nahi. "Naya Test banayein" dabayein.</div>'}
${vis().map(t=>{const pg=LS.g('prog_'+t.id,null),rs=LS.g('res_'+t.id,null);return`<div class="c"><h3>${esc(t.name)}</h3>
${t.srv?'<span class="tg">☁ Server</span> ':''}<span class="tg">${esc(t.sub)}</span> <span class="tg">${t.qs.length} Q</span> <span class="tg">${t.dur} min</span> <span class="tg">+${t.pos} / -${t.neg}</span>
${rs?`<div class="mu">Last score: ${rs.score}/${+(t.qs.length*t.pos).toFixed(2)}</div>`:''}
<div class="row" style="margin-top:8px">${pg?`<button class="g" onclick="st('${t.id}',0)">▶ Resume (${ft(pg.rem)} bacha)</button><button onclick="st('${t.id}',1)">Naya start</button>`:`<button class="p" onclick="st('${t.id}',1)">Start Test</button>`}
${rs?`<button onclick="shR('${t.id}')">Result</button>`:''}<button onclick="shT('${t.id}')">Share</button>${t.srv?(ED?`<button class="d" onclick="dl('${t.id}')">🗑 Server se hatayein</button>`:''):`${ED&&DB?`<button class="p" onclick="up('${t.id}')">☁ Server par daalein</button>`:''}<button class="d" onclick="dl('${t.id}')">🗑 Delete</button>`}</div></div>`}).join('')}`}
function shApp(){dlg(`<h3>App link</h3><textarea id="al" style="min-height:70px" readonly>${esc(location.href.split('#')[0])}</textarea><button onclick="cp('al')">Copy</button><small></small><p class="mu">Ye link kholne par students ko ye app milega. Test unhe "Share code" se import karna hoga.</p><button class="p" onclick="dlg('')">Band</button>`)}
function shT(id){const t=fnd(id),o={name:t.name,sub:t.sub,cat:t.cat||cat,dur:t.dur,pos:t.pos,neg:t.neg,qs:t.qs};
const code=btoa(unescape(encodeURIComponent(JSON.stringify(o))));dlg(`<h3>Test share code</h3><textarea id="sc" readonly>${code}</textarea><button onclick="cp('sc')">Copy code</button><small></small><p class="mu">Student app mein "Share code se test lein" dabake paste kare.</p><button class="p" onclick="dlg('')">Band</button>`)}
function impC(){dlg(`<h3>Share code paste karein</h3><textarea id="ic" placeholder="code yahan paste karein"></textarea><div class="er" id="ie"></div><div class="row"><button onclick="dlg('')">Cancel</button><button class="p" onclick="doImp()">Import</button></div>`)}
function doImp(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#ic').value.trim()))));if(!o.qs||!o.qs.length)throw 0;if(tests.length>=MAX){$('#ie').textContent='Storage full ('+MAX+'). Pehle koi test delete karein.';return}
o.id='t'+Date.now()+Math.random().toString(36).slice(2,5);o.cat=o.cat||cat;tests.unshift(o);sv();dlg('');render()}catch(e){$('#ie').textContent='Code galat hai ya adhura hai.'}}
function dl(id){const t=fnd(id);cfm('Test "'+esc(t.name)+'" delete karna hai? Wapas nahi aayega.',async()=>{if(t.srv){try{await DB.doc('tests/'+t.did).delete()}catch(e){toast('Server se delete nahi hua (sirf editor kar sakta hai).');return}}else{tests=tests.filter(x=>x.id!=id);sv()}LS.r('prog_'+id);LS.r('res_'+id);render()})}
/* ---------- create ---------- */
function nw(){view='new';render()}
function Vn(){return`<div class="top"><b>Naya Test</b><button onclick="view='home';render()">← Back</button></div>
<div class="c"><label>Test ka naam</label><input id="nm" value="sscpmock test">
<label>Exam</label><select id="ct"><option${cat=='SSC'?' selected':''}>SSC</option></select><label>Subject</label><select id="sb"><option>GK/GS</option><option>Math</option><option>Reasoning</option><option>Mixed</option></select>
<div class="row"><div><label>Time (min)</label><input id="du" type="number" value="43" min="1"></div><div><label>Sahi (+)</label><input id="pm" type="number" value="1" step="0.25"></div><div><label>Galat (-)</label><input id="ng" type="number" value="0.25" step="0.05" min="0"></div></div>
<label>MCQ paste karein (ek baar mein 100 ya zyada) ya text file chunein</label>
<input type="file" id="fl" accept=".txt,text/plain" multiple onchange="lf(this)">
<textarea id="tx" placeholder="Q1: Question English || प्रश्न हिंदी&#10;A: option || विकल्प&#10;B: ...&#10;C: ...&#10;D: ...&#10;ANS: B&#10;EXP: Explanation || व्याख्या"></textarea>
<div class="row"><button onclick="ex('gk')">GK/GS example</button><button onclick="ex('math')">Math example</button><button onclick="ex('rs')">Reasoning example</button></div>
<div class="er" id="msg"></div>
<p class="mu"><b>Format:</b> har MCQ Q:, A:, B:, C:, D:, ANS: (A/B/C/D), EXP: (optional). Hindi ke liye English ke baad <b>||</b> lagayein. MCQ ke beech khali line rakhein.<br><b>Math chinh:</b> x^2 → x², sqrt(49) → √(49), frac(3,4) → ¾ jaisa bhinn, pi → π, deg → °, &lt;= → ≤, &gt;= → ≥, != → ≠, +- → ±, times → ×, div → ÷, H_2O → H₂O</p>
<button class="p" onclick="svT()">Test save karein</button></div>`}
function lf(el){[...el.files].forEach(f=>{const r=new FileReader();r.onload=()=>{$('#tx').value+=(($('#tx').value?'\n\n':'')+r.result)};r.readAsText(f)})}
function ex(k){$('#tx').value=EX[k];$('#sb').value=k=='gk'?'GK/GS':k=='math'?'Math':'Reasoning'}
function svT(){const {qs,bad}=parse($('#tx').value),m=$('#msg');if(tests.length>=MAX){m.textContent='Storage full ('+MAX+' test). Purane test delete karein.';return}
if(!qs.length){m.textContent='Ek bhi sahi MCQ nahi mila. Format check karein.'+(bad.length?'\nGalat MCQ number: '+bad.join(', '):'');return}
const go=()=>{cat=$('#ct').value;LS.s('cat',cat);tests.unshift({id:'t'+Date.now(),cat:cat,name:$('#nm').value.trim()||'Test',sub:$('#sb').value,dur:+$('#du').value||43,pos:+$('#pm').value||1,neg:+$('#ng').value||0,qs});sv();view='home';render()};
if(bad.length)cfm(qs.length+' MCQ sahi mile, '+bad.length+' galat (number: '+bad.slice(0,15).join(', ')+'). Sirf sahi wale save karein?',()=>{go()});else go()}
/* ---------- test ---------- */
function st(id,fresh){T=fnd(id);let p=fresh?null:LS.g('prog_'+id,null);if(fresh)LS.r('prog_'+id);
if(!p)p={i:0,a:T.qs.map(()=>null),s:T.qs.map(()=>0),t:T.qs.map(()=>0),rem:T.dur*60,paused:false};
p.paused=false;if(!p.s[p.i])p.s[p.i]=1;P=p;view='test';last=Date.now();clearInterval(tk);tk=setInterval(tick,1000);sp2();render()}
function sp2(){LS.s('prog_'+T.id,P)}
function tick(){const n=Date.now(),d=Math.min((n-last)/1000,2);last=n;if(view!='test'||P.paused)return;P.rem-=d;P.t[P.i]+=d;
const e=$('#tm');if(e)e.textContent=ft(P.rem);if(++cnt%5==0)sp2();if(P.rem<=0)sub(true)}
function pz(){if(view!='test'||P.paused)return;P.paused=true;sp2();render()}
function rs(){P.paused=false;last=Date.now();render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pz();else last=Date.now()});
addEventListener('pagehide',()=>{if(view=='test'){P.paused=true;sp2()}});
function go(j){if(j<0||j>=T.qs.length)return;P.i=j;if(!P.s[j])P.s[j]=1;sp2();render()}
function sel(k){P.a[P.i]=k;sp2();render()}
function sn(){P.s[P.i]=P.a[P.i]!=null?2:1;go(P.i+1);if(P.i==T.qs.length-1)render()}
function mn(){P.s[P.i]=P.a[P.i]!=null?4:3;go(P.i+1)}
function cl(){P.a[P.i]=null;P.s[P.i]=1;sp2();render()}
function setL(v){lang=v;LS.s('lang',v);render()}
const LB=()=>`<select onchange="setL(this.value)"><option value="both"${lang=='both'?' selected':''}>English + हिंदी</option><option value="en"${lang=='en'?' selected':''}>English</option><option value="hi"${lang=='hi'?' selected':''}>हिंदी</option></select>`;
function Vt(){const q=T.qs[P.i],n=T.qs.length,i=P.i;
if(P.paused)return`<div class="ov"><div><h2>⏸ Test Pause hai</h2><p>Bacha hua time: <b>${ft(P.rem)}</b></p><button class="g" onclick="rs()">▶ Resume</button> <button onclick="sp2();view='home';render()">Home</button></div></div>`;
return`<div class="top"><b>${esc(T.name)}</b><span class="tm" id="tm">${ft(P.rem)}</span><button onclick="pz()">⏸ Pause</button></div>
<div class="bar">Q ${i+1} / ${n}<span class="mk">+${T.pos} / -${T.neg}</span><span style="margin-left:auto">${LB()}</span></div>
<div class="c"><div class="qt">${pk(q.q)}</div>${q.o.map((o,k)=>`<div class="op${P.a[i]===k?' on':''}" onclick="sel(${k})"><span>${'ABCD'[k]}</span><div>${pk(o)}</div></div>`).join('')}</div>
<div class="nav"><button onclick="go(${i-1})"${i?'':' disabled'}>← Previous</button><button class="v" onclick="mn()">Mark for Review & Next</button><button onclick="cl()">Clear</button><button class="p" onclick="sn()">Save & Next →</button></div>
<div class="c"><div class="lgd"><span><i style="background:var(--gr)"></i>Not visited</span><span><i style="background:var(--no)"></i>Not answered</span><span><i style="background:var(--ok)"></i>Answered</span><span><i style="background:var(--rv)"></i>Review</span></div>
<div class="pal">${T.qs.map((_,j)=>`<button class="pb s${P.s[j]}${j==i?' cur':''}" onclick="go(${j})">${j+1}</button>`).join('')}</div></div>
<button class="g" style="width:100%" onclick="cs()">Submit Test</button>`}
function cs(){const a=P.a.filter(x=>x!=null).length,rv=P.s.filter(x=>x>=3).length;
dlg(`<h3>Submit karein?</h3><p>Answered: <b>${a}</b><br>Not answered: <b>${T.qs.length-a}</b><br>Marked for review: <b>${rv}</b><br>Bacha time: <b>${ft(P.rem)}</b></p><div class="row"><button onclick="dlg('')">Wapas</button><button class="g" onclick="dlg('');sub()">Haan, Submit</button></div>`)}
function sub(){clearInterval(tk);dlg('');let c=0,w=0;T.qs.forEach((q,i)=>{if(P.a[i]==null)return;P.a[i]==q.a?c++:w++});
R={id:T.id,date:Date.now(),a:P.a,t:P.t,c,w,u:T.qs.length-c-w,score:+(c*T.pos-w*T.neg).toFixed(2),used:T.dur*60-Math.max(0,P.rem)};
LS.s('res_'+T.id,R);LS.r('prog_'+T.id);flt='all';view='res';render();scrollTo(0,0)}
function shR(id){T=fnd(id);R=LS.g('res_'+id,null);flt='all';view='res';render()}
function Vr(){const n=T.qs.length,tot=+(n*T.pos).toFixed(2);
return`<div class="top"><b>Result: ${esc(T.name)}</b><button onclick="view='home';render()">Home</button></div>
<div class="c"><h2>Score: ${R.score} / ${tot}</h2>
<div class="st"><div><b style="color:var(--ok)">${R.c}</b>Sahi</div><div><b style="color:var(--no)">${R.w}</b>Galat</div><div><b>${R.u}</b>Unattempted</div><div><b>${R.c+R.w?Math.round(R.c/(R.c+R.w)*100):0}%</b>Accuracy</div><div><b>${ft(R.used)}</b>Time laga</div></div>
<small>Marking: sahi +${T.pos}, galat -${T.neg}</small>
<div class="row" style="margin-top:10px"><button class="p" onclick="st('${T.id}',1)">🔁 Retake Test</button>${LB()}<select onchange="flt=this.value;render()"><option value="all">Sab MCQ</option><option value="w"${flt=='w'?' selected':''}>Sirf galat</option><option value="c"${flt=='c'?' selected':''}>Sirf sahi</option><option value="u"${flt=='u'?' selected':''}>Unattempted</option></select></div></div>
${T.qs.map((q,i)=>{const a=R.a[i],ok=a==q.a,k=a==null?'u':ok?'c':'w';if(flt!='all'&&flt!=k)return'';
return`<div class="c"><div class="row"><b>Q${i+1}</b><span class="tg" style="flex:0">${k=='c'?'✔ Sahi +'+T.pos:k=='w'?'✘ Galat -'+T.neg:'— Chhoda 0'}</span><span class="tg" style="flex:0">⏱ ${Math.max(1,Math.round(R.t[i]))} sec</span></div>
<div class="qt" style="margin-top:8px">${pk(q.q)}</div>${q.o.map((o,j)=>`<div class="op${j==q.a?' ok':j==a?' bad':''}" style="cursor:default"><span>${'ABCD'[j]}</span><div>${pk(o)}${j==a?' <small>(Aapka jawab)</small>':''}${j==q.a?' <small>(Sahi)</small>':''}</div></div>`).join('')}
${(q.e[0]||q.e[1])?`<div class="ex"><b>Explanation:</b><br>${pk(q.e)}</div>`:''}</div>`}).join('')}`}
function render(){$('#app').innerHTML=view=='home'?Vh():view=='new'?Vn():view=='test'?Vt():Vr()}
const fnd=id=>srv.find(t=>t.id==id)||tests.find(t=>t.id==id);
const vis=()=>[...srv,...tests].filter(t=>(t.cat||'SSC')==cat);
function setC(c){cat=c;LS.s('cat',c);render()}
async function up(id){const t=tests.find(x=>x.id==id);if(!DB)return toast('Server connected nahi hai.');if(srv.length>=MAX)return toast('Server par '+MAX+' test full hain. Pehle purane hatayein.');
const j=JSON.stringify(t.qs);if(j.length>230000)return toast('Test bahut bada hai (server limit ~230 KB). Do tests mein baantein.');
try{await DB.collection('tests').add({name:t.name,sub:t.sub,cat:t.cat||cat,dur:t.dur,pos:t.pos,neg:t.neg,n:t.qs.length,qs:j,at:Date.now()});toast('Server par chala gaya ✓ Ab students ko sirf app ka link bhejein.')}catch(e){toast('Server par nahi ja saka: '+(e.code||e.message||'error')+'. Sirf owner/editor upload kar sakta hai.')}}
async function initDB(){try{const c=window.claude;if(!c||!c.use){sst='Server nahi mila (sirf local tests)';render();return}
const u=await c.use('user');ED=u?await u.canEdit():false;DB=await c.use('db');
if(!DB){sst='Server ke liye claude.ai login chahiye (sirf local tests)';render();return}
sst='Server connected';render();
DB.collection('tests').onSnapshot(s=>{srv=s.docs.map(d=>{const x=d.data();try{return{id:'s'+d.id,did:d.id,srv:1,at:x.at||0,name:x.name,sub:x.sub,cat:x.cat,dur:x.dur,pos:x.pos,neg:x.neg,qs:JSON.parse(x.qs)}}catch(e){return null}}).filter(Boolean).sort((a,b)=>b.at-a.at);if(view=='home')render()},e=>{sst='Server error: '+(e.code||'');if(view=='home')render()})}catch(e){sst='Server nahi mila (sirf local tests)';render()}}
initDB();
render();
</script></body></html>
